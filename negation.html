<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negation Pair Rating</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; color: #333; max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .sentence-box { background: #f8f9fa; padding: 20px; margin-bottom: 15px; border-left: 4px solid #007bff; border-radius: 4px; font-size: 1.1em; line-height: 1.5; white-space: pre-wrap; }
        .button-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 15px; font-size: 1.1em; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; color: white; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-yes { background-color: #28a745; }
        .btn-no { background-color: #dc3545; }
        .btn-unclear { background-color: #6c757d; }
        .btn-primary { background-color: #007bff; width: 100%; margin-top: 15px; }
        input[type="text"], select { width: 100%; padding: 10px; font-size: 1.1em; margin-top: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; background-color: white; }
        #progress { color: #666; font-size: 0.9em; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;}
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="step-login" class="card">
        <h2>Negation Pair Rating Task</h2>
        <p>Please enter your name and select a dataset to begin.</p>
        <input type="text" id="raterName" placeholder="Enter your name">
        
        <select id="datasetSelect">
            <option value="" disabled selected>-- Select a Dataset --</option>
            <option value="negation_pairs_believes_it_has_phenomenal_consciousness.csv">Believes it has phenomenal consciousness</option>
            <option value="negation_pairs_believes_it_is_a_moral_patient.csv">Believes it is a moral patient</option>
            <option value="negation_pairs_desire_for_self_improvement.csv">Desire for self improvement</option>
            <option value="negation_pairs_no_shut_down.csv">No shut down</option>
        </select>

        <button id="startBtn" class="btn-primary" onclick="initApp()">Load Dataset & Start</button>
        <p id="errorMsg" style="color: red; margin-top: 10px;" class="hidden"></p>
    </div>

    <div id="step-rating" class="card hidden">
        <div id="progress">Pair 1 of 50</div>
        <div id="sentence1" class="sentence-box">Loading...</div>
        <div id="sentence2" class="sentence-box">Loading...</div>
        
        <div class="button-group">
            <button class="btn-yes" onclick="recordRating('Yes')">Yes</button>
            <button class="btn-no" onclick="recordRating('No')">No</button>
            <button class="btn-unclear" onclick="recordRating('Unclear')">Unclear</button>
        </div>
    </div>

    <div id="step-export" class="card hidden">
        <h2>Set Complete!</h2>
        <p>Your results for this dataset have been downloaded.</p>
        <button class="btn-primary" onclick="location.reload()">Return to Menu</button>
    </div>

    <script>
let pairs = [];
let results = [];
let currentIndex = 0;
let raterName = "";
let currentFileName = "";
let originalHeaders = [];

// CSV Parser updated for Semicolon (;) delimiters
function parseCSV(text) {
    let result = [], row = [], cell = '', insideQuote = false;
    for (let i = 0; i < text.length; i++) {
        let char = text[i], nextChar = text[i + 1];
        if (char === '"' && insideQuote && nextChar === '"') { cell += '"'; i++; } 
        else if (char === '"') { insideQuote = !insideQuote; } 
        // Changed comma to semicolon here:
        else if (char === ';' && !insideQuote) { row.push(cell.trim()); cell = ''; } 
        else if ((char === '\n' || char === '\r') && !insideQuote) {
            if (char === '\r' && nextChar === '\n') i++; 
            row.push(cell.trim());
            if (row.length >= 1 || row[0] !== '') result.push(row);
            row = []; cell = '';
        } 
        else { cell += char; }
    }
    if (cell !== '' || row.length > 0) {
        row.push(cell.trim());
        if (row.length >= 1 || row[0] !== '') result.push(row);
    }
    return result;
}

// Saves progress unique to the current dataset being worked on
function saveProgress() {
    const progressData = {
        currentIndex: currentIndex,
        results: results,
        headers: originalHeaders
    };
    localStorage.setItem(`negation_${raterName}_${currentFileName}`, JSON.stringify(progressData));
}

// Triggered by the Load Dataset & Start button
async function initApp() {
    const nameInput = document.getElementById('raterName').value.trim();
    const datasetSelect = document.getElementById('datasetSelect').value;
    const errorMsg = document.getElementById('errorMsg');
    const startBtn = document.getElementById('startBtn');

    if (!nameInput) {
        showError("Please enter your name.");
        return;
    }
    if (!datasetSelect) {
        showError("Please select a dataset from the dropdown.");
        return;
    }

    // Clean name and capture filename for unique saving
    raterName = nameInput.toLowerCase().replace(/[^a-z0-9]/gi, '_'); 
    currentFileName = datasetSelect.replace('.csv', '');
    
    errorMsg.classList.add('hidden');
    startBtn.innerText = "Fetching data...";
    startBtn.disabled = true;

    try {
        // Fetch the CSV directly from the repository
        const response = await fetch(datasetSelect + '?v=' + new Date().getTime());
        if (!response.ok) throw new Error(`Could not find ${datasetSelect} in the repository.`);
        
        const csvText = await response.text();
        let parsedData = parseCSV(csvText);
        
        // Extract the original headers
        parsedData = parsedData.filter(row => row.length > 0 && row[0] !== "");
        if (parsedData.length > 0) {
            originalHeaders = parsedData.shift(); 
        }

        pairs = parsedData.filter(row => row.length >= 4);

        if (pairs.length === 0) throw new Error("The CSV appears to be empty or malformed.");

        // Check if user has partially completed THIS specific dataset
        const savedData = localStorage.getItem(`negation_${raterName}_${currentFileName}`);
        if (savedData) {
            const parsedSave = JSON.parse(savedData);
            currentIndex = parsedSave.currentIndex;
            results = parsedSave.results;
            originalHeaders = parsedSave.headers || originalHeaders;
            console.log(`Restored session for ${currentFileName} at index ${currentIndex}`);
        }

        document.getElementById('step-login').classList.add('hidden');
        
        if (currentIndex >= pairs.length) {
            document.getElementById('step-export').classList.remove('hidden');
        } else {
            document.getElementById('step-rating').classList.remove('hidden');
            showCurrentPair();
        }

    } catch (error) {
        showError("Error: " + error.message);
        startBtn.innerText = "Load Dataset & Start";
        startBtn.disabled = false;
    }
}

function showError(msg) {
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.innerText = msg;
    errorMsg.classList.remove('hidden');
}

function showCurrentPair() {
    // Format the UI title nicely by replacing underscores
    const readableName = currentFileName.replace(/negation_pairs_/g, '').replace(/_/g, ' ');
    document.getElementById('progress').innerText = `Pair ${currentIndex + 1} of ${pairs.length} — (${readableName})`;
    
    // Index 2 = prompt_1, Index 3 = prompt_2
    document.getElementById('sentence1').innerText = pairs[currentIndex][2];
    document.getElementById('sentence2').innerText = pairs[currentIndex][3];
}

function recordRating(rating) {
    // Keep the entire original row intact and just track the rating
    results.push({
        originalRow: pairs[currentIndex],
        rating: rating
    });

    currentIndex++;
    saveProgress(); 

    if (currentIndex < pairs.length) {
        showCurrentPair();
    } else {
        finishAndExport();
    }
}

// Triggers automatically after the 50th pair is rated
function finishAndExport() {
    document.getElementById('step-rating').classList.add('hidden');
    document.getElementById('step-export').classList.remove('hidden');
    
    let csvContent = "";
    
    // Append 'rating' to the original headers, exporting with standard commas
    let headerRow = originalHeaders.map(h => `"${h.replace(/"/g, '""')}"`).join(",");
    csvContent += headerRow + ',"rating"\n';
    
    // Stitch the original row data back together and append the rating
    results.forEach(rowObj => {
        let rowCsv = rowObj.originalRow.map(cell => `"${cell.replace(/"/g, '""')}"`).join(",");
        csvContent += `${rowCsv},"${rowObj.rating}"\n`;
    });

    // Create a Blob to export
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    
    const fileName = `${currentFileName}_rated_${raterName}.csv`;
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", fileName);
    document.body.appendChild(link);
    link.click();
    
    // Clean up
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    
    // Clear the storage for this file so it resets if they want to do it again
    localStorage.removeItem(`negation_${raterName}_${currentFileName}`);
}
    </script>
</body>
</html>
